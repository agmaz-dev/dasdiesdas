<style>

.wrap{display:flex;flex-wrap:wrap;gap:8px}

.btn.gh{background:var(--s2);border:1px solid var(--bd);color:var(--tx)}

.empty{height:12px}

.dtop{display:none}
@media(min-width:900px){html,body{overflow-x:hidden}
#app{max-width:1200px;padding-bottom:40px}#app.n{max-width:720px}
.nav,.tip{display:none}

.dtop nav{display:flex;gap:16px;font-size:14px;color:#d1d5db}.dtop nav a:hover{color:var(--or)}

.dtop .act{display:flex;gap:10px;align-items:center;margin-left:auto}
.dtop .ab{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--bd);font-size:14px;font-weight:600}
.dtop .ab.o{background:var(--orb);border-color:var(--orb);color:#fff}
.dtop .ab svg{width:18px;height:18px}
#app.home .top{display:none}
.top{position:static}.top .bar{height:60px;padding:0 16px}.top .bar h1{text-align:left;font-size:22px}
.note{border-radius:0}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:0 24px}
.sec{padding:22px 24px 10px}.hs{padding:0 24px 4px}.tools,.cnt{padding-left:24px;padding-right:24px}
.card{width:210px}
.lc{flex-direction:column}.lc img{width:100%;height:auto;aspect-ratio:4/3}.lc .p{padding:12px 40px 14px 14px}
.lc .hz{background:rgba(0,0,0,.5);color:#fff;border-radius:50%;padding:6px;display:grid}
.adw{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;padding:24px}
.adw .gal img{border-radius:16px}.adw .facts,.adw .seller,.adw .hint{margin-left:0;margin-right:0}.adw .pad{padding:0 0 14px}
.adw .cta{position:static;transform:none;max-width:none;background:none;border:0;padding:12px 0}
.adw .sp{display:none}
.cta{max-width:720px}
.sheet{max-width:560px;bottom:auto;top:50%;border-radius:20px;border:1px solid var(--bd);transform:translate(-50%,-40%);opacity:0;pointer-events:none;transition:.2s}
.sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.hello,.stats{padding-left:24px;padding-right:24px}
.ph{grid-template-columns:repeat(4,1fr)}.ph div.big{grid-column:span 4;aspect-ratio:3/1}
}
@media(min-width:900px) and (max-width:1199px){.dtop nav{display:none}}
</style>

const h=s=>{let x=2166136261;for(const ch of s){x^=ch.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0};
const fmt=n=>n.toLocaleString('de-DE');
const CAR2=["Autos","SUV, Geländewagen & Pick-up","Elektroautos","Oldtimer & Klassiker","Unfallfahrzeuge & Bastlerfahrzeuge","Fahrzeuge mit Behindertenumbau"],MOTO2=["Motorräder & Motorroller","Quads, ATV & UTV"];
function node(path){let n={c:TREE},out=[];for(const i of path){n=n.c[i];out.push(n)}return out}
function cnt(n,key){if(!n.c)return 3+h(key)%380;return n.c.reduce((a,c,i)=>a+cnt(c,key+'.'+i),0)}
function brandKey(path){if(path.length!==2||path[0]!==1)return null;const nm=TREE[1].c[path[1]].n;return CAR2.includes(nm)?'cars':MOTO2.includes(nm)?'moto':null}
const sub=n=>n.c?n.c.slice(0,3).map(c=>c.n).join(', ')+' & mehr':'';
const ini=s=>s.replace(/[^A-Za-zÄÖÜäöü0-9]/g,'').slice(0,2).toUpperCase();
const CITY=['Berlin-Mitte','Berlin-Kreuzberg','Berlin-Neukölln','Potsdam','Berlin-Spandau','Hamburg','München','Berlin-Pankow','Leipzig','Köln'];
const ADJ=['Top Zustand','wie neu','gepflegt','kaum benutzt','mit Garantie','abholbereit','Schnäppchen','VB'];
function items(key,title,n=12){const r=[];for(let k=0;k<n;k++){const s=h(key+':'+k);r.push({id:key+':'+k,img:`https://picsum.photos/seed/dd${s%100000}/480/360`,t:`${title} – ${ADJ[s%ADJ.length]}`,p:fmt(10*(1+s%400))+' €',c:CITY[s%CITY.length],d:['Heute','Gestern','Vor 2 Tagen','Vor 3 Tagen'][s%4],tp:s%5===0})}return r}
const tb=(title,left='back',right='')=>`<div class="note">Design-Vorschau – nur Optik, Beispieldaten</div><header class="top"><div class="bar"><button class="ib" onclick="${left==='menu'?'openDrawer()':'history.back()'}">${ic(left)}</button><h1>${title}</h1>${right||'<a class="ib" href="#s">'+ic('search')+'</a>'}</div></header>`;
const dtop=()=>`<header class="dtop"><a class="logo" href="#">das<b>dies</b>das</a><nav><a href="#cats">Entdecken</a><a href="#c/0">Immobilien</a><a href="#c/1">Fahrzeuge</a><a href="#c/10">Dienstleistungen</a><a href="#c/14">Nachbarschaft</a></nav><a class="search" href="#s">${ic('search')}<span>Wonach suchst du?</span><span class="loc">${ic('pin')}Berlin</span></a><div class="act"><a class="ab" href="#chats">${ic('chat')}Chats</a><a class="ab" href="#me">${ic('user')}Konto</a><a class="ab o" href="#neu/1">${ic('plus')}Inserieren</a></div></header>`;

function vCat(path){

 html+=row('#r/'+key,`Alle Anzeigen in „${n.n}“`,cnt(n,key),{cls:'all',lead:`<span class="sq">${ic('grid')}</span>`});
 if(bk){const b=Object.keys(BRANDS[bk]);html+=`</div><div class="sec">Marken</div><div class="list">`+b.map(m=>row(`#m/${key}/${encodeURIComponent(m)}`,m,null,{d:fmt(5+h(key+m)%1500)+' Anzeigen',lead:`<span class="sq">${ini(m)}</span>`})).join('')+row(`#r/${key}`,'Weitere Marken',null,{d:'Alle anderen Marken',lead:`<span class="sq">···</span>`});}

 closeAll();const r=(location.hash||'#').slice(1).split('/');let v;
